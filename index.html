<style>
/* Layout: one-screen app shell — header, scrolling table, thumb-reach action bar. Cards are the only "objects". */
:root {
  --bg: #e4e6ec;
  --surface: #f3f4f7;
  --fg: #101116;
  --muted: #5a5f6e;
  --line: #c9ccd6;
  --accent: #ffd21f;
  --accent-ink: #101116;
  --card-black: #0b0b0d;
  --card-black-ink: #ffffff;
  --card-white: #ffffff;
  --card-white-ink: #0b0b0d;
  --shadow: 0 1px 2px rgba(16,17,22,.08), 0 6px 18px rgba(16,17,22,.10);
  --danger: #c4262e;
  --font-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-card: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121318; --surface: #1b1d24; --fg: #f1f2f5; --muted: #9a9fae; --line: #2c2f39;
    --accent: #ffd21f; --accent-ink: #101116;
    --card-black: #000000; --card-black-ink: #ffffff; --card-white: #f7f7f5; --card-white-ink: #0b0b0d;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45); --danger: #ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121318; --surface: #1b1d24; --fg: #f1f2f5; --muted: #9a9fae; --line: #2c2f39;
  --accent: #ffd21f; --accent-ink: #101116;
  --card-black: #000000; --card-black-ink: #ffffff; --card-white: #f7f7f5; --card-white-ink: #0b0b0d;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45); --danger: #ff6b6b;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; max-width: 560px; margin: 0 auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { background: none; border: 0; padding: 0; font: 800 1.35rem/1 var(--font-display); letter-spacing: -.02em; color: var(--fg); }
.logo b { color: var(--accent); -webkit-text-stroke: .5px var(--fg); }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: .875rem; display: inline-flex; gap: 8px; align-items: center; }
.chip-btn .n { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }

main { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 4px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.bar { padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); background: var(--bg); }
.bar:empty { display: none; }

.btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 16px 18px; font: 800 1.05rem/1.1 var(--font-body); background: var(--fg); color: var(--bg); transition: transform .08s ease, opacity .15s; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .35; cursor: not-allowed; transform: none; }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); font-weight: 700; }
.btn.danger { background: var(--danger); color: #fff; }

.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
h1, h2 { font-family: var(--font-display); letter-spacing: -.025em; margin: 0; text-wrap: balance; line-height: 1.02; }
h1 { font-size: clamp(2.2rem, 10vw, 3.4rem); font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 800; }
p { margin: 0; }
.lead { color: var(--muted); font-size: 1rem; max-width: 34ch; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; }

/* Cards */
.bcard { background: var(--card-black); color: var(--card-black-ink); border-radius: 16px; padding: 20px 20px 16px; min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); font: 800 1.4rem/1.22 var(--font-card); letter-spacing: -.012em; overflow-wrap: anywhere; }
.bcard.sm { min-height: 0; font-size: 1.08rem; padding: 14px 16px 12px; gap: 10px; border-radius: 14px; }
.bcard .blank { display: inline-block; width: 3.6em; border-bottom: .12em solid currentColor; vertical-align: baseline; margin: 0 .1em; }
.bcard .fill { color: var(--accent); }
.bcard .fill.block { display: block; margin-top: .45em; }
.bcard .foot { display: flex; justify-content: space-between; align-items: center; font: 700 .72rem/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
.pick { border: 1.5px solid currentColor; border-radius: 999px; padding: 4px 8px; }
.bcard.pickable { cursor: pointer; text-align: left; width: 100%; transition: transform .12s ease, box-shadow .12s; }
.bcard.pickable.sel { box-shadow: 0 0 0 4px var(--accent), var(--shadow); transform: translateY(-2px); }

.hand { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.wcard { position: relative; background: var(--card-white); color: var(--card-white-ink); border: 1px solid var(--line); border-radius: 13px; padding: 14px 13px 30px; min-height: 140px; text-align: left; font: 800 1rem/1.24 var(--font-card); letter-spacing: -.01em; box-shadow: var(--shadow); overflow-wrap: anywhere; transition: transform .12s ease, background .12s; }
.wcard::after { content: "Schaamteloos"; position: absolute; left: 13px; bottom: 11px; font: 700 .6rem/1 var(--font-body); letter-spacing: .07em; text-transform: uppercase; opacity: .45; }
.wcard.sel { background: var(--accent); color: var(--accent-ink); transform: translateY(-3px) rotate(-.6deg); }
.wcard .badge { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--card-black); color: var(--card-black-ink); font: 800 .85rem/26px var(--font-body); text-align: center; }
.wcard.blanco { border: 2px dashed var(--muted); font-style: italic; font-weight: 700; }

.field { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 13px 14px; font-size: 1rem; }
.field:focus { border-color: var(--fg); outline: none; }
label.lbl { font-weight: 700; font-size: .9rem; }

/* Setup */
.players { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; gap: 8px; align-items: center; }
.prow .num { width: 22px; text-align: right; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.prow .field { flex: 1; min-width: 0; }
.x { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; font-size: 1.2rem; color: var(--muted); }
.add { align-self: flex-start; background: none; border: 0; padding: 6px 0; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.stepper { display: flex; align-items: center; gap: 0; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.stepper button { width: 48px; height: 46px; border: 0; background: transparent; font-size: 1.3rem; font-weight: 700; }
.stepper output { min-width: 44px; text-align: center; font: 800 1.15rem/1 var(--font-body); font-variant-numeric: tabular-nums; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.setting .t { font-weight: 700; }
.setting .s { color: var(--muted); font-size: .85rem; }
details.rules { border-top: 1px solid var(--line); padding-top: 12px; }
details.rules summary { font-weight: 700; cursor: pointer; }
details.rules ol { margin: 10px 0 0; padding-left: 1.2em; color: var(--muted); display: flex; flex-direction: column; gap: 6px; max-width: 60ch; }
.resume { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.resume .btn { width: auto; padding: 11px 16px; font-size: .95rem; }
.err { color: var(--danger); font-weight: 600; font-size: .9rem; }

/* Pass screen */
.pass { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding-block: 24px; }
.pass .who { font: 800 clamp(2.8rem, 15vw, 5rem)/.95 var(--font-display); letter-spacing: -.035em; overflow-wrap: anywhere; }
.pass .stackcards { position: relative; height: 92px; margin-bottom: 8px; }
.pass .stackcards i { position: absolute; width: 62px; height: 86px; border-radius: 9px; background: var(--card-white); border: 1px solid var(--line); box-shadow: var(--shadow); }
.pass .stackcards i:nth-child(1) { transform: rotate(-10deg); left: 0; }
.pass .stackcards i:nth-child(2) { transform: rotate(-2deg); left: 26px; }
.pass .stackcards i:nth-child(3) { transform: rotate(7deg); left: 52px; background: var(--card-black); }

/* Scores */
.scores { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.scores li { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--line); }
.scores li:last-child { border-bottom: 0; }
.scores .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; display: flex; gap: 8px; align-items: center; }
.scores .pts { display: flex; gap: 4px; align-items: center; }
.pip { width: 11px; height: 15px; border-radius: 3px; border: 1.5px solid var(--line); }
.pip.on { background: var(--accent); border-color: var(--fg); }
.scores .score { font: 800 1.05rem/1 var(--font-body); font-variant-numeric: tabular-nums; min-width: 1.6em; text-align: right; }
.tag { font-size: .68rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; background: var(--fg); color: var(--bg); }
.tag.y { background: var(--accent); color: var(--accent-ink); }

.status { display: flex; gap: 8px; flex-wrap: wrap; }
.status .tag { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.status .tag.done { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--bg); border-radius: 20px 20px 0 0; padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 88%; overflow-y: auto; animation: up .22s ease; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }

.win-burst { animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.85) rotate(-3deg); opacity: .2; } }
.deal .wcard { animation: deal .35s ease backwards; }
@keyframes deal { from { transform: translateY(14px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

const BLANCO = "\u0000blanco";
const HAND = 7;
const KEY = "schaamteloos.v1";

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const main = $("#main"), bar = $("#bar"), overlay = $("#overlay");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pickOf = t => (t.match(/___/g) || []).length || 1;

function fillHTML(text, answers) {
  let i = 0;
  let html = esc(text).replace(/___/g, (m, off, str) => {
    if (i >= answers.length) return '<span class="blank"></span>';
    const before = str.slice(0, off).trim();
    let a = answers[i++];
    a = (before === "" || /[.!?:]$/.test(before)) ? cap(a) : a;
    return `<span class="fill">${esc(a)}</span>`;
  });
  if (!text.includes("___")) html += answers.map(a => `<span class="fill block">${esc(cap(a))}.</span>`).join("");
  return html;
}
function blackCard(text, answers = [], cls = "") {
  const p = pickOf(text);
  return `<div class="bcard ${cls}"><div>${fillHTML(text, answers)}</div><div class="foot"><span>Schaamteloos</span>${p > 1 ? `<span class="pick">Kies ${p}</span>` : ""}</div></div>`;
}

let S = null;               // spelstatus
let setup = { names: ["", "", ""], target: 5, error: "" };
let sel = [];               // geselecteerde handkaarten (indexen)
let blankText = "";
let judgeSel = null;
let menuConfirm = false;

function save() { try { S ? localStorage.setItem(KEY, JSON.stringify(S)) : localStorage.removeItem(KEY); } catch (e) {} }
function load() { try { const v = JSON.parse(localStorage.getItem(KEY)); return v && v.players ? v : null; } catch (e) { return null; } }

/* ---------- Spel-logica ---------- */
function newGame(names, target) {
  S = {
    players: names.map(n => ({ name: n, score: 0, hand: [] })),
    target, round: 0, czar: Math.floor(Math.random() * names.length) - 1,
    deckW: shuffle(WHITE.concat(Array(10).fill(BLANCO))), discardW: [],
    deckB: shuffle(BLACK.map((_, i) => i)),
    phase: "intro", black: null, subs: [], queue: [], last: null, winner: null
  };
  if (S.czar < 0) S.czar = names.length - 1;
  nextRound();
}
function drawW() {
  if (!S.deckW.length) { S.deckW = shuffle(S.discardW); S.discardW = []; }
  return S.deckW.pop();
}
function drawB() {
  if (!S.deckB.length) S.deckB = shuffle(BLACK.map((_, i) => i));
  return S.deckB.pop();
}
function nextRound() {
  const n = S.players.length;
  S.round++;
  S.czar = (S.czar + 1) % n;
  S.players.forEach(p => { while (p.hand.length < HAND) p.hand.push(drawW()); });
  S.black = BLACK[drawB()];
  S.subs = []; S.last = null;
  S.queue = []; for (let k = 1; k < n; k++) S.queue.push((S.czar + k) % n);
  S.phase = "intro";
  go();
}
function submit() {
  const pi = S.queue[0], p = S.players[pi];
  const cards = sel.map(i => p.hand[i] === BLANCO ? blankText.trim() : p.hand[i]);
  sel.slice().sort((a, b) => b - a).forEach(i => {
    const c = p.hand.splice(i, 1)[0];
    S.discardW.push(c);
  });
  S.subs.push({ p: pi, cards });
  S.queue.shift();
  sel = []; blankText = "";
  if (S.queue.length) S.phase = "pass";
  else { S.subs = shuffle(S.subs); S.phase = "passCzar"; }
  go();
}
function judge() {
  const sub = S.subs[judgeSel];
  S.players[sub.p].score++;
  S.last = { p: sub.p, cards: sub.cards, black: S.black };
  if (S.players[sub.p].score >= S.target) S.winner = sub.p;
  S.phase = "result";
  judgeSel = null;
  try { navigator.vibrate && navigator.vibrate([30, 40, 60]); } catch (e) {}
  go();
}

/* ---------- Schermen ---------- */
function go() { save(); render(); main.scrollTop = 0; }

function render() {
  const inGame = !!S;
  $("#menuBtn").hidden = !inGame;
  if (inGame) $("#roundN").textContent = "ronde " + S.round;
  const view = !S ? viewSetup : ({ intro: viewIntro, pass: viewPass, hand: viewHand, passCzar: viewPassCzar, judge: viewJudge, result: viewResult, over: viewOver })[S.phase];
  const [m, b] = view();
  main.innerHTML = m; bar.innerHTML = b || "";
}

function viewSetup() {
  const saved = load();
  const names = setup.names.map((n, i) => `
    <div class="prow">
      <span class="num">${i + 1}</span>
      <input class="field" id="name-${i}" data-name="${i}" value="${esc(n)}" placeholder="${["Sanne", "Daan", "Lotte", "Mo", "Fleur", "Bram", "Noor", "Jesse", "Iris", "Thijs"][i]}" maxlength="18" autocomplete="off" enterkeyhint="next">
      ${setup.names.length > 3 ? `<button class="x" type="button" data-act="rm" data-i="${i}" aria-label="Verwijder speler ${i + 1}">×</button>` : ""}
    </div>`).join("");
  return [`
    ${saved ? `<div class="resume"><div><div class="eyebrow">Spel bezig</div><strong>Ronde ${saved.round} · ${saved.players.length} spelers</strong></div><button class="btn accent" type="button" data-act="resume">Ga verder</button></div>` : ""}
    <section class="stack">
      <h1>Het feestspel voor slechte mensen.</h1>
      <p class="lead">Eén telefoon, 3 tot 10 spelers. Geef hem rond, speel je foutste kaart en laat de rechter kiezen.</p>
    </section>
    ${blackCard("Mijn oma zegt dat ___ vroeger allemaal beter was.", ["hagelslag in mijn bed"])}
    <section class="stack">
      <h2>Spelers</h2>
      <div class="players">${names}</div>
      ${setup.names.length < 10 ? `<button class="add" type="button" data-act="add">+ Speler toevoegen</button>` : ""}
      ${setup.error ? `<p class="err">${esc(setup.error)}</p>` : ""}
    </section>
    <section class="setting">
      <div><div class="t">Punten om te winnen</div><div class="s">Eerste die dit haalt wint</div></div>
      <div class="stepper"><button type="button" data-act="tdown" aria-label="Minder punten">−</button><output id="target">${setup.target}</output><button type="button" data-act="tup" aria-label="Meer punten">+</button></div>
    </section>
    <details class="rules">
      <summary>Hoe speel je?</summary>
      <ol>
        <li>Elke ronde is iemand de <strong>rechter</strong>. Die leest de zwarte kaart hardop voor.</li>
        <li>Iedereen anders krijgt de telefoon om de beurt en kiest stiekem de grappigste witte kaart(en) uit z'n hand.</li>
        <li>Blanco kaarten mag je zelf invullen.</li>
        <li>De rechter krijgt alle antwoorden anoniem te zien, leest ze voor en kiest een winnaar. Die krijgt een punt.</li>
        <li>De rechter schuift door. Wie als eerste het puntentotaal haalt, wint.</li>
      </ol>
    </details>
  `, `<button class="btn" type="button" data-act="start">Start spel</button>`];
}

function viewIntro() {
  const cz = S.players[S.czar];
  const first = S.players[S.queue[0]];
  return [`
    <section class="stack">
      <div class="eyebrow">Ronde ${S.round}</div>
      <h1>${esc(cz.name)} is de rechter.</h1>
      <p class="lead">${esc(cz.name)}, lees deze kaart hardop voor aan iedereen.</p>
    </section>
    ${blackCard(S.black)}
    ${scoresHTML()}
  `, `<button class="btn" type="button" data-act="toPass">Voorgelezen · geef aan ${esc(first.name)}</button>`];
}

function viewPass() {
  const p = S.players[S.queue[0]];
  const done = S.subs.length, total = S.players.length - 1;
  return [`
    <section class="pass">
      <div class="stackcards" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="eyebrow">Geef de telefoon aan</div>
      <div class="who">${esc(p.name)}</div>
      <p class="lead">Niet spieken, de rest. ${done} van ${total} spelers heeft al gespeeld.</p>
    </section>
  `, `<button class="btn" type="button" data-act="toHand">Ik ben ${esc(p.name)} · toon mijn kaarten</button>`];
}

function viewHand() {
  const p = S.players[S.queue[0]];
  const pick = pickOf(S.black);
  const cards = p.hand.map((c, i) => {
    const s = sel.indexOf(i);
    const isB = c === BLANCO;
    return `<button type="button" class="wcard${isB ? " blanco" : ""}${s >= 0 ? " sel" : ""}" data-act="card" data-i="${i}" style="animation-delay:${i * 35}ms">
      ${isB ? "Blanco kaart: schrijf je eigen antwoord" : esc(cap(c)) + "."}
      ${s >= 0 && pick > 1 ? `<span class="badge">${s + 1}</span>` : ""}
    </button>`;
  }).join("");
  return [`
    <section class="stack">
      <div class="row" style="justify-content:space-between"><div class="eyebrow">${esc(p.name)} · ${pick > 1 ? `kies ${pick} kaarten, in volgorde` : "kies 1 kaart"}</div></div>
      <div id="preview">${previewHTML(p)}</div>
    </section>
    ${blankField(p)}
    <section class="hand deal" id="hand">${cards}</section>
  `, `<button class="btn" type="button" id="playBtn" data-act="play" ${canPlay(p) ? "" : "disabled"}>${playLabel(p)}</button>`];
}
function chosenTexts(p) { return sel.map(i => p.hand[i] === BLANCO ? (blankText.trim() || "…") : p.hand[i]); }
function previewHTML(p) { return blackCard(S.black, chosenTexts(p), "sm"); }
function blankField(p) {
  const has = sel.some(i => p.hand[i] === BLANCO);
  return `<section class="stack" id="blankWrap" ${has ? "" : "hidden"}>
    <label class="lbl" for="blank-input">Jouw blanco kaart</label>
    <input class="field" id="blank-input" maxlength="80" placeholder="Typ je eigen antwoord" value="${esc(blankText)}" autocomplete="off">
  </section>`;
}
function canPlay(p) {
  const pick = pickOf(S.black);
  if (sel.length !== pick) return false;
  if (sel.some(i => p.hand[i] === BLANCO) && !blankText.trim()) return false;
  return true;
}
function playLabel(p) {
  const pick = pickOf(S.black);
  if (sel.length < pick) return pick > 1 ? `Kies nog ${pick - sel.length} kaart${pick - sel.length > 1 ? "en" : ""}` : "Kies een kaart";
  if (!canPlay(p)) return "Vul je blanco kaart in";
  return pick > 1 ? "Speel deze kaarten" : "Speel deze kaart";
}
function refreshHand() {
  const p = S.players[S.queue[0]];
  const pick = pickOf(S.black);
  document.querySelectorAll("#hand .wcard").forEach(el => {
    const i = +el.dataset.i, s = sel.indexOf(i);
    el.classList.toggle("sel", s >= 0);
    const old = el.querySelector(".badge"); if (old) old.remove();
    if (s >= 0 && pick > 1) el.insertAdjacentHTML("beforeend", `<span class="badge">${s + 1}</span>`);
  });
  $("#preview").innerHTML = previewHTML(p);
  const has = sel.some(i => p.hand[i] === BLANCO);
  $("#blankWrap").hidden = !has;
  const btn = $("#playBtn"); btn.disabled = !canPlay(p); btn.textContent = playLabel(p);
}

function viewPassCzar() {
  const cz = S.players[S.czar];
  return [`
    <section class="pass">
      <div class="stackcards" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="eyebrow">Alle kaarten liggen erin · geef de telefoon aan de rechter</div>
      <div class="who">${esc(cz.name)}</div>
      <p class="lead">Lees straks elk antwoord hardop voor. Niemand verraadt welke van hem is.</p>
    </section>
  `, `<button class="btn" type="button" data-act="toJudge">Ik ben ${esc(cz.name)} · toon de antwoorden</button>`];
}

function viewJudge() {
  const list = S.subs.map((s, i) => `
    <button type="button" class="bcard sm pickable${judgeSel === i ? " sel" : ""}" data-act="jpick" data-i="${i}">
      <div>${fillHTML(S.black, s.cards)}</div>
      <div class="foot"><span>Antwoord ${i + 1}</span>${judgeSel === i ? `<span class="pick">Gekozen</span>` : ""}</div>
    </button>`).join("");
  return [`
    <section class="stack">
      <div class="eyebrow">${esc(S.players[S.czar].name)} · rechter</div>
      <h2>Lees ze allemaal voor en kies de beste.</h2>
    </section>
    <section class="stack">${list}</section>
  `, `<button class="btn" type="button" data-act="judge" ${judgeSel === null ? "disabled" : ""}>Kies als winnaar</button>`];
}

function viewResult() {
  const w = S.players[S.last.p];
  const over = S.winner !== null && S.winner !== undefined;
  return [`
    <section class="stack">
      <div class="eyebrow">Ronde ${S.round} · winnaar</div>
      <h1>${esc(w.name)} pakt het punt.</h1>
    </section>
    <div class="win-burst">${blackCard(S.last.black, S.last.cards)}</div>
    ${scoresHTML(S.last.p)}
  `, over
    ? `<button class="btn accent" type="button" data-act="toOver">Bekijk de eindstand</button>`
    : `<button class="btn" type="button" data-act="next">Volgende ronde · ${esc(S.players[(S.czar + 1) % S.players.length].name)} is rechter</button>`];
}

function viewOver() {
  const w = S.players[S.winner];
  return [`
    <section class="stack win-burst">
      <div class="eyebrow">Na ${S.round} rondes</div>
      <h1>${esc(w.name)} is officieel de meest schaamteloze.</h1>
      <p class="lead">Gefeliciteerd. Denk er even over na wat dit over je zegt.</p>
    </section>
    ${scoresHTML(S.winner)}
  `, `<button class="btn accent" type="button" data-act="again">Nog een potje, zelfde spelers</button>
      <button class="btn ghost" type="button" data-act="quit">Nieuwe spelers</button>`];
}

function scoresHTML(hi) {
  const rows = S.players.map((p, i) => ({ p, i })).sort((a, b) => b.p.score - a.p.score);
  const pips = n => Array.from({ length: S.target }, (_, k) => `<span class="pip${k < n ? " on" : ""}"></span>`).join("");
  return `<section class="stack">
    <div class="eyebrow">Stand · ${S.target} punten om te winnen</div>
    <ul class="scores">${rows.map(({ p, i }) => `
      <li><span class="nm">${esc(p.name)}${i === S.czar && S.phase !== "over" ? ' <span class="tag">rechter</span>' : ""}${i === hi ? ' <span class="tag y">+1</span>' : ""}</span>
      <span class="pts">${S.target <= 10 ? pips(p.score) : ""}<span class="score">${p.score}</span></span></li>`).join("")}
    </ul></section>`;
}

/* ---------- Menu ---------- */
function openMenu() {
  if (!S) return;
  overlay.hidden = false;
  overlay.innerHTML = `<div class="scrim" data-act="closeMenu"><div class="sheet" data-stop="1" role="dialog" aria-label="Stand en menu">
    <div class="row" style="justify-content:space-between"><h2>Ronde ${S.round}</h2><button class="chip-btn" type="button" data-act="closeMenu">Sluiten</button></div>
    ${scoresHTML()}
    ${menuConfirm
      ? `<p><strong>Dit spel stoppen?</strong> De stand gaat verloren.</p><button class="btn danger" type="button" data-act="quit">Ja, stop het spel</button><button class="btn ghost" type="button" data-act="noQuit">Toch niet</button>`
      : `<button class="btn" type="button" data-act="closeMenu">Verder spelen</button><button class="btn ghost" type="button" data-act="askQuit">Stop dit spel</button>`}
  </div></div>`;
}
function closeMenu() { overlay.hidden = true; overlay.innerHTML = ""; menuConfirm = false; }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  if (t.dataset.act === "closeMenu" && e.target.closest("[data-stop]") && t.classList.contains("scrim")) return;
  const a = t.dataset.act, i = +t.dataset.i;
  switch (a) {
    case "menu": if (S) openMenu(); break;
    case "closeMenu": closeMenu(); break;
    case "askQuit": menuConfirm = true; openMenu(); break;
    case "noQuit": menuConfirm = false; openMenu(); break;
    case "quit": closeMenu(); S = null; save(); render(); break;
    case "add": readNames(); if (setup.names.length < 10) setup.names.push(""); render(); { const el = $("#name-" + (setup.names.length - 1)); el && el.focus(); } break;
    case "rm": readNames(); setup.names.splice(i, 1); render(); break;
    case "tdown": setup.target = Math.max(1, setup.target - 1); $("#target").textContent = setup.target; break;
    case "tup": setup.target = Math.min(20, setup.target + 1); $("#target").textContent = setup.target; break;
    case "resume": S = load(); render(); break;
    case "start": startGame(); break;
    case "toPass": S.phase = "pass"; go(); break;
    case "toHand": S.phase = "hand"; sel = []; blankText = ""; go(); break;
    case "card": {
      const p = S.players[S.queue[0]], pick = pickOf(S.black);
      const k = sel.indexOf(i);
      if (k >= 0) sel.splice(k, 1);
      else { if (pick === 1) sel = [i]; else if (sel.length < pick) sel.push(i); else { sel.shift(); sel.push(i); } }
      refreshHand();
      if (p.hand[i] === BLANCO && sel.includes(i)) { const el = $("#blank-input"); el && el.focus(); }
      break;
    }
    case "play": if (canPlay(S.players[S.queue[0]])) submit(); break;
    case "toJudge": S.phase = "judge"; judgeSel = null; go(); break;
    case "jpick": judgeSel = i; document.querySelectorAll(".pickable").forEach(el => { const on = +el.dataset.i === i; el.classList.toggle("sel", on); const f = el.querySelector(".foot"); f.innerHTML = `<span>Antwoord ${+el.dataset.i + 1}</span>${on ? '<span class="pick">Gekozen</span>' : ""}`; }); bar.querySelector(".btn").disabled = false; break;
    case "judge": if (judgeSel !== null) judge(); break;
    case "next": nextRound(); break;
    case "toOver": S.phase = "over"; go(); break;
    case "again": newGame(S.players.map(p => p.name), S.target); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.name !== undefined) setup.names[+e.target.dataset.name] = e.target.value;
  if (e.target.id === "blank-input") {
    blankText = e.target.value;
    const p = S.players[S.queue[0]];
    $("#preview").innerHTML = previewHTML(p);
    const btn = $("#playBtn"); btn.disabled = !canPlay(p); btn.textContent = playLabel(p);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeMenu(); return; }
  if (e.key !== "Enter") return;
  if (e.target.dataset.name !== undefined) {
    e.preventDefault();
    const n = +e.target.dataset.name;
    const next = $("#name-" + (n + 1));
    if (next) next.focus(); else e.target.blur();
  }
  if (e.target.id === "blank-input") { e.preventDefault(); e.target.blur(); }
});

function readNames() { document.querySelectorAll("[data-name]").forEach(el => setup.names[+el.dataset.name] = el.value); }
function startGame() {
  readNames();
  const names = setup.names.map((n, i) => n.trim() || $("#name-" + i).placeholder);
  const lower = names.map(n => n.toLowerCase());
  if (new Set(lower).size !== names.length) { setup.error = "Twee spelers hebben dezelfde naam. Maak ze uniek."; render(); return; }
  setup.error = "";
  setup.names = names.slice();
  wake();
  newGame(names, setup.target);
}
async function wake() { try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (S && document.visibilityState === "visible") wake(); });

/* ---------- Start ---------- */
function boot(data) {
  if (data && data.S) S = data.S; else S = load();
  if (data && data.setup) setup = data.setup;
  render();
}
